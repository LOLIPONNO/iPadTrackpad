name: iPadTrackpad
options:
  bundleIdPrefix: com.ipadtrackpad
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"

packages:
  SharedKit:
    path: ./SharedKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEVELOPMENT_TEAM: L4MPX7NZ2D

targets:
  TrackpadClient:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: TrackpadClient/Sources
    info:
      path: TrackpadClient/Info.plist
      properties:
        CFBundleDisplayName: TrackpadClient
        CADisableMinimumFrameDurationOnPhone: true
        NSBonjourServices:
          - _virtualtrackpad._tcp
        NSLocalNetworkUsageDescription: TrackpadClient uses Bonjour over USB and Wi-Fi to discover and stream low-latency touch events to your Mac.
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
    dependencies:
      - package: SharedKit
        product: SharedKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ipadtrackpad.client
        TARGETED_DEVICE_FAMILY: "2" # iPad only
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO

  TrackpadServer:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: TrackpadServer/Sources
    info:
      path: TrackpadServer/Info.plist
      properties:
        CFBundleDisplayName: TrackpadServer
        LSUIElement: true
        NSBonjourServices:
          - _virtualtrackpad._tcp
        NSLocalNetworkUsageDescription: TrackpadServer advertises over Bonjour on USB and Wi-Fi so your iPad can control your Mac cursor and gestures.
    entitlements:
      path: TrackpadServer/TrackpadServer.entitlements
    dependencies:
      - package: SharedKit
        product: SharedKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ipadtrackpad.server
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES
